<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
  <body>

    <!-- CART HEADER -->

    <section class="cart-header">

        <p class="cart-label">✦ YOUR ORDER ✦</p>

        <div class="cart-decoration">
    <span></span>
    <i class="fa-solid fa-heart"></i>
    <span></span>
</div>

<h1>Your <span>Shopping Cart</span></h1>

<div class="cart-decoration">
    <span></span>
    <i class="fa-solid fa-heart"></i>
    <span></span>
</div>

        <p class="cart-subtitle">
            Review your delicious selections<br>
            before checking out.
        </p>

    </section>


    <!-- CART CONTENT -->

    <main class="cart-container">


        <!-- ITEMS WILL APPEAR HERE -->

        <section class="cart-items-section">

            <div id="cartItems">

                <!-- JavaScript will put the cakes here -->

            </div>


            <!-- EMPTY CART -->

            <div id="emptyCart" class="empty-cart">

                <div class="empty-cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>♡</span>
                </div>

                <div class="empty-decoration">
                    ✧ ❦ ✧
                </div>

                <h2>Your cart is empty</h2>

                <p>
                    Add some delicious cakes to your cart.
                </p>

                <a href="Cakes.html" class="browse-button">
                    ❦ &nbsp; BROWSE OUR CAKES &nbsp; ❦
                </a>

            </div>

        </section>


        <!-- ORDER SUMMARY -->

        <section class="order-summary">

            <div class="summary-title-decoration">
                ❦ ─────────
            </div>

            <h2>Order Summary</h2>

            <div class="summary-title-decoration">
                ───────── ❦
            </div>


            <div class="subtotal">

                <span>Subtotal</span>

                <strong id="subtotal">
                    ₦0
                </strong>

            </div>


            <div class="summary-line"></div>


           <button
    type="button"
    class="checkout-btn"
    id="checkoutButton">

    PROCEED TO CHECKOUT

    <i class="fa-solid fa-arrow-right"></i>

</button>


            <a href="cakes.html" class="continue-shopping">
                ← Continue Shopping
            </a>

        </section>

    </main>

     <script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

       function addToCart(cakeName) {

    const cakes = {
        "Vanilla Dream": {
            price: 21000,
            image: "vanillacake.png"
        },

        "Chocolate Delight": {
            price: 25000,
            image: "chocolatecake.png"
        },

        "Strawberry Bliss": {
            price: 28000,
            image: "strawberrycake.png"
        },

        "Red Velvet": {
            price: 27000,
            image: "redvelvetcake.png"
        },

        "pink delight": {
            price: 26000,
            image: "Birthdaycake.png"
        }
    };

    const cake = cakes[cakeName];

    if (!cake) {
        console.log("Cake not found:", cakeName);
        return;
    }

    const existingCake = cart.find(function(item) {
        return item.name === cakeName;
    });

    if (existingCake) {

        existingCake.quantity++;

    } else {

        cart.push({
            name: cakeName,
            price: cake.price,
            image: cake.image,
            quantity: 1
        });

    }

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    updateCartCount();

    showCartMessage(cakeName);
}


/* =========================
   DISPLAY CART
========================= */

function displayCart() {

    const cartItems = document.getElementById("cartItems");
    const emptyCart = document.getElementById("emptyCart");
    const subtotal = document.getElementById("subtotal");

    const cartNumber = document.querySelector(".cart span");

    cartItems.innerHTML = "";

    let total = 0;
    let totalQuantity = 0;


    /* CART IS EMPTY */

    if (cart.length === 0) {

        emptyCart.style.display = "block";

        subtotal.textContent = "₦0";

        if (cartNumber) {
            cartNumber.textContent = "0";
        }

        return;
    }


    /* CART HAS ITEMS */

    emptyCart.style.display = "none";


    cart.forEach(function(item, index) {

        total += item.price * item.quantity;

        totalQuantity += item.quantity;


        const cartItem = document.createElement("div");

        cartItem.className = "cart-item";


        cartItem.innerHTML = `

            <img
                src="${item.image}"
                alt="${item.name}"
            >

            <div class="cart-item-info">

                <h3>${item.name}</h3>

                <p>
                    ₦${item.price.toLocaleString()}
                </p>

            </div>


            <div class="quantity-controls">

                <button onclick="decreaseQuantity(${index})">
                    −
                </button>

                <span>
                    ${item.quantity}
                </span>

                <button onclick="increaseQuantity(${index})">
                    +
                </button>

            </div>


            <button
                class="remove-item"
                onclick="removeItem(${index})"
            >

                <i class="fa-solid fa-trash"></i>

            </button>

        `;


        cartItems.appendChild(cartItem);

    });


    /* UPDATE SUBTOTAL */

    subtotal.textContent =
        "₦" + total.toLocaleString();


    /* UPDATE CART NUMBER */

    if (cartNumber) {
        cartNumber.textContent = totalQuantity;
    }

}


/* =========================
   INCREASE QUANTITY
========================= */

function increaseQuantity(index) {

    cart[index].quantity++;

    saveCart();

}


/* =========================
   DECREASE QUANTITY
========================= */

function decreaseQuantity(index) {

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

    } else {

        cart.splice(index, 1);

    }

    saveCart();

}


/* =========================
   REMOVE CAKE
========================= */

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

}


/* =========================
   SAVE CART
========================= */

function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();

}


/* =========================
   EMPTY CART MESSAGE
========================= */

function showEmptyCartMessage() {

    const message = document.createElement("div");

    message.className = "empty-cart-message";


    message.innerHTML = `

        <div class="message-icon">

            <i class="fa-solid fa-exclamation"></i>

        </div>


        <div class="message-content">

            <strong>
                Your cart is empty
            </strong>

            <span>
                Please add a delicious cake before checking out.
            </span>

        </div>


        <button onclick="this.parentElement.remove()">

            <i class="fa-solid fa-xmark"></i>

        </button>

    `;


    document.body.appendChild(message);


    /* Automatically remove message */

    setTimeout(function() {

        message.classList.add("hide");


        setTimeout(function() {

            message.remove();

        }, 400);

    }, 4000);

}

       
/* =========================
   ADDED TO CART MESSAGE
========================= */

function showCartMessage(cakeName) {

    const message = document.createElement("div");

    message.className = "cart-message";

    message.innerHTML = `

        <div class="cart-message-icon">

            <i class="fa-solid fa-check"></i>

        </div>

        <div class="cart-message-content">

            <strong>
                Added to cart! ♡
            </strong>

            <span>
                ${cakeName} has been added to your cart.
            </span>

        </div>

        <button onclick="this.parentElement.remove()">

            <i class="fa-solid fa-xmark"></i>

        </button>

    `;

    document.body.appendChild(message);


    /* Automatically remove message */

    setTimeout(function() {

        message.classList.add("hide");

        setTimeout(function() {

            message.remove();

        }, 400);

    }, 3000);

}

/* =========================
   CHECKOUT MESSAGE
========================= */

function showCheckoutMessage() {

    const message = document.createElement("div");

    message.className = "checkout-message";


    message.innerHTML = `

        <div class="checkout-message-icon">

            <i class="fa-solid fa-cake-candles"></i>

        </div>


        <div class="checkout-message-content">

            <strong>
                Almost there! ♡
            </strong>

            <span>
                Our checkout is being prepared.
                Your delicious order will be ready soon!
            </span>

        </div>


        <button onclick="this.parentElement.remove()">

            <i class="fa-solid fa-xmark"></i>

        </button>

    `;


    document.body.appendChild(message);


    /* Automatically remove message */

    setTimeout(function() {

        message.classList.add("hide");


        setTimeout(function() {

            message.remove();

        }, 400);

    }, 4000);

}



/* =========================
   LOAD CART
========================= */

displayCart();

       document
    .getElementById("checkoutButton")
    .addEventListener("click", function() {

        if (cart.length === 0) {

            showEmptyCartMessage();

            return;
        }

        window.location.href = "checkout.html";

    });

</script>

    <script>
(function () {

    const savedTheme =
        localStorage.getItem("aliceTheme") || "light";

    document.body.classList.add(

    );

})();
</script>

</body>
</html>
